<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tiny-md</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --fg: #1f2328;
  --fg-muted: #656d76;
  --border: #d8dde3;
  --accent: #0969da;
  --code-bg: #f0f2f5;
  --blockquote: #59636e;
  --shadow: rgba(0, 0, 0, 0.08);
}
html[data-theme="dark"] {
  --bg: #14181d;
  --bg-soft: #1c2128;
  --fg: #d6dde4;
  --fg-muted: #8b949e;
  --border: #343b44;
  --accent: #539bf5;
  --code-bg: #22282f;
  --blockquote: #8b949e;
  --shadow: rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- Toolbar ---------- */
#toolbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
}
#toolbar button {
  font: inherit;
  font-size: 13px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
}
#toolbar button:hover { border-color: var(--accent); color: var(--accent); }
#toolbar button:disabled { opacity: 0.45; cursor: default; }
#toolbar button:disabled:hover { border-color: var(--border); color: var(--fg); }
#toolbar .spacer { flex: 1; }
#file-label {
  font-size: 13px;
  color: var(--fg-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 40vw;
}
#file-label .dot { color: var(--accent); font-weight: 700; }

/* ---------- Workspace ---------- */
#workspace {
  flex: 1;
  display: flex;
  min-height: 0;
}
#editor-pane {
  flex: 1;
  min-width: 0;
  display: none;
  border-right: 1px solid var(--border);
}
body.mode-edit #editor-pane { display: flex; }
#editor {
  flex: 1;
  width: 100%;
  border: 0;
  resize: none;
  outline: none;
  padding: 24px 28px;
  font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--fg);
  tab-size: 4;
}
#preview-pane {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
}

/* ---------- Markdown-Typografie ---------- */
.md-body {
  max-width: 46rem;
  margin: 0 auto;
  padding: 40px 32px 96px;
  font-size: 17px;
  line-height: 1.65;
  overflow-wrap: break-word;
}
body.mode-edit .md-body { padding-top: 24px; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
  margin: 1.6em 0 0.6em;
  line-height: 1.25;
  font-weight: 650;
}
.md-body h1:first-child, .md-body h2:first-child { margin-top: 0.2em; }
.md-body h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.md-body h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
.md-body h3 { font-size: 1.2em; }
.md-body h4 { font-size: 1.05em; }
.md-body p { margin: 0.9em 0; }
.md-body a { color: var(--accent); text-decoration: none; }
.md-body a:hover { text-decoration: underline; }
.md-body ul, .md-body ol { padding-left: 1.8em; margin: 0.9em 0; }
.md-body li { margin: 0.25em 0; }
.md-body li > p { margin: 0.4em 0; }
.md-body input[type="checkbox"] { margin-right: 0.45em; }
.md-body blockquote {
  margin: 1em 0;
  padding: 0.1em 1.1em;
  border-left: 4px solid var(--border);
  color: var(--blockquote);
}
.md-body code {
  font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  font-size: 0.85em;
  background: var(--code-bg);
  padding: 0.15em 0.4em;
  border-radius: 5px;
}
.md-body pre {
  background: var(--code-bg);
  border-radius: 8px;
  padding: 14px 18px;
  overflow-x: auto;
  line-height: 1.5;
  margin: 1em 0;
}
.md-body pre code { background: none; padding: 0; font-size: 0.82em; }
.md-body table {
  border-collapse: collapse;
  margin: 1.1em 0;
  display: block;
  max-width: 100%;
  overflow-x: auto;
}
.md-body th, .md-body td {
  border: 1px solid var(--border);
  padding: 6px 14px;
}
.md-body th { background: var(--bg-soft); font-weight: 650; }
.md-body tr:nth-child(2n) td { background: var(--bg-soft); }
.md-body img { max-width: 100%; border-radius: 6px; }
.md-body hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
.md-body .mermaid-diagram { margin: 1.2em 0; text-align: center; }
.md-body .mermaid-diagram svg { max-width: 100%; height: auto; }
.md-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.md-body .openapi-hint { color: var(--fg-muted); font-size: 0.9em; }

/* ---------- OpenAPI / SwaggerUI ---------- */
#swagger { display: none; min-height: 100%; background: #ffffff; color: #3b4151; padding: 8px 0 96px; }
body.view-openapi #swagger { display: block; }
body.view-openapi #preview { display: none; }
/* SwaggerUI kennt kein Dark-Theme – im Dunkelmodus invertieren (Farben per hue-rotate erhalten) */
html[data-theme="dark"] #swagger { filter: invert(0.92) hue-rotate(180deg); }

/* ---------- Statusleiste ---------- */
#statusbar {
  flex: none;
  display: flex;
  gap: 18px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--fg-muted);
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
#statusbar .spacer { flex: 1; }
#copyright { color: var(--fg-muted); text-decoration: none; opacity: 0.75; }
#copyright:hover { color: var(--accent); opacity: 1; }

/* ---------- Drag & Drop ---------- */
#drop-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  opacity: 0.94;
  font-size: 22px;
  color: var(--accent);
  border: 3px dashed var(--accent);
  z-index: 10;
  pointer-events: none;
}
body.dragging #drop-overlay { display: flex; }

/* ---------- Druck: nur der gerenderte Inhalt ---------- */
@media print {
  #toolbar, #statusbar, #editor-pane { display: none !important; }
  body { overflow: visible; }
  #preview-pane { overflow: visible; }
  .md-body { max-width: none; padding: 0; }
  html[data-theme="dark"] #swagger { filter: none; }
}
</style>
<style>/*__KATEX_CSS__*/</style>
<style>/*__SWAGGER_CSS__*/</style>
</head>
<body class="mode-read">

<header id="toolbar">
  <button id="btn-open" title="Markdown-Datei öffnen (Strg+O)">Öffnen</button>
  <button id="btn-edit" title="Zwischen Lesen und Bearbeiten wechseln (Strg+E)">Bearbeiten</button>
  <button id="btn-save" title="Markdown speichern (Strg+S)">Speichern</button>
  <span class="spacer"></span>
  <span id="file-label"></span>
  <button id="btn-theme" title="Hell/Dunkel umschalten">◐</button>
</header>

<main id="workspace">
  <section id="editor-pane">
    <textarea id="editor" spellcheck="false" placeholder="# Markdown hier eingeben …"></textarea>
  </section>
  <section id="preview-pane">
    <article id="preview" class="md-body"></article>
    <div id="swagger"></div>
  </section>
</main>

<footer id="statusbar">
  <span id="status-mode"></span>
  <span class="spacer"></span>
  <span id="status-count"></span>
  <a id="copyright" href="https://github.com/aresstack" target="_blank" rel="noopener">© 2026 AresStack</a>
</footer>

<div id="drop-overlay">Datei hier ablegen</div>
<input type="file" id="file-input" accept=".md,.markdown,.mdown,.txt,.yaml,.yml,.json" hidden>

<!-- Eingebettetes Dokument: wird vom Build-Skript befüllt. Leer = App startet ohne Dokument. -->
<script type="text/markdown" id="embedded-md" data-filename="__EMBEDDED_FILENAME__">__EMBEDDED_MD__</script>

<script>/*__MARKED_JS__*/</script>
<script>/*__PURIFY_JS__*/</script>
<script>/*__MERMAID_JS__*/</script>
<script>/*__KATEX_JS__*/</script>
<script>/*__SWAGGER_JS__*/</script>

<script>
"use strict";

/* ---------- Renderer ---------- */
marked.setOptions({ gfm: true, breaks: false });

/* ---------- Mathe: $…$ / $$…$$ (KaTeX nur in den KaTeX-Build-Varianten) ----------
   Der Tokenizer greift Formeln VOR der CommonMark-Escape-Verarbeitung ab,
   sonst zerstört marked LaTeX-Sequenzen wie \, oder \{ . Ohne KaTeX wird
   der Originaltext unverändert (escaped) angezeigt. */
const hasKatex = typeof katex !== "undefined";

function renderMath(tex, displayMode, raw) {
  if (!hasKatex) {
    return displayMode
      ? '<pre class="math-src">' + escapeHtml(raw) + "</pre>"
      : '<span class="math-src">' + escapeHtml(raw) + "</span>";
  }
  return katex.renderToString(tex, { displayMode, throwOnError: false });
}

marked.use({
  extensions: [
    {
      name: "mathBlock",
      level: "block",
      start: src => src.indexOf("$$"),
      tokenizer(src) {
        const m = /^\$\$([\s\S]+?)\$\$/.exec(src);
        if (m) return { type: "mathBlock", raw: m[0], text: m[1].trim() };
      },
      renderer(tok) { return renderMath(tok.text, true, tok.raw); },
    },
    {
      name: "mathInline",
      level: "inline",
      start: src => src.indexOf("$"),
      tokenizer(src) {
        // Kein Leerzeichen nach öffnendem/vor schließendem $, keine Ziffer
        // danach – damit Dollar-Beträge ("$5 und $10") kein Mathe werden.
        const m = /^\$(?!\s)((?:\\.|[^\n$])+?)(?<!\s)\$(?!\d)/.exec(src);
        if (m) return { type: "mathInline", raw: m[0], text: m[1] };
      },
      renderer(tok) { return renderMath(tok.text, false, tok.raw); },
    },
  ],
});

function renderMarkdown(md) {
  const raw = marked.parse(md);
  return DOMPurify.sanitize(raw);
}

// Ein fremdes Dokument darf beim Öffnen nichts nachladen (Tracking-Pixel,
// Lesebestätigung): automatisch ladende Elemente verlieren Fernressourcen-
// URLs. data:-URIs, relative Pfade und klickbare Links (<a href>) bleiben.
DOMPurify.addHook("afterSanitizeAttributes", node => {
  if (/^(img|image|source|track|video|audio|input|use)$/i.test(node.tagName)) {
    for (const attr of ["src", "href", "xlink:href", "srcset", "poster"]) {
      const v = node.getAttribute(attr);
      if (v && v.includes("//")) node.removeAttribute(attr);
    }
  }
  const style = node.getAttribute("style");
  if (style && /url\s*\(/i.test(style)) {
    node.setAttribute("style", style.replace(/url\s*\([^)]*\)/gi, "none"));
  }
});
// Gleiches für CSS in <style>-Elementen (url(), @import)
DOMPurify.addHook("uponSanitizeElement", (node, data) => {
  if (data.tagName === "style" && node.textContent && /url\s*\(|@import/i.test(node.textContent)) {
    node.textContent = node.textContent
      .replace(/url\s*\([^)]*\)/gi, "none")
      .replace(/@import[^;]*(;|$)/gi, "");
  }
});

/* ---------- Mermaid (optional, nur in der Mermaid-Build-Variante enthalten) ---------- */
const hasMermaid = typeof mermaid !== "undefined";

function initMermaid() {
  if (!hasMermaid) return;
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default",
  });
}

let mermaidSeq = 0;
let mermaidRun = 0;
async function renderMermaidIn(container) {
  if (!hasMermaid) return;
  const run = ++mermaidRun;
  for (const code of container.querySelectorAll("pre > code.language-mermaid")) {
    try {
      const { svg } = await mermaid.render("mmd-" + (++mermaidSeq), code.textContent);
      if (run !== mermaidRun) return; // Vorschau wurde inzwischen neu aufgebaut
      const div = document.createElement("div");
      div.className = "mermaid-diagram";
      div.innerHTML = svg;
      code.parentElement.replaceWith(div);
    } catch (_) {
      // Ungültiges Diagramm (z. B. während des Tippens) → Codeblock stehen lassen
    }
  }
}

/* ---------- OpenAPI (optional, nur in der Swagger-Build-Variante enthalten) ----------
   .yaml/.yml/.json-Dateien mit openapi:/swagger:-Versionsangabe werden mit
   SwaggerUI angezeigt; ohne SwaggerUI (oder bei anderem YAML/JSON) als Codeblock. */
const hasSwagger = typeof SwaggerUIBundle !== "undefined";
const SPEC_EXT = /\.(ya?ml|json)$/i;

function isOpenApi(filename, text) {
  return SPEC_EXT.test(filename) &&
    /(^|[{,]\s*)["']?(openapi|swagger)["']?\s*:\s*["']?\d/m.test(text);
}

// YAML/JSON, das nicht mit SwaggerUI angezeigt wird, als Codeblock rendern
function specAsMarkdown(filename, text) {
  const longest = Math.max(2, ...(text.match(/`+/g) || []).map(t => t.length));
  const fence = "`".repeat(longest + 1);
  const lang = /\.json$/i.test(filename) ? "json" : "yaml";
  const hint = isOpenApi(filename, text)
    ? '<p class="openapi-hint">OpenAPI-Spezifikation erkannt – zur grafischen Anzeige <code>tiny-md-swagger.html</code> verwenden.</p>\n\n'
    : "";
  return hint + fence + lang + "\n" + text + "\n" + fence + "\n";
}

let swaggerUi = null;
function renderSwagger(text) {
  if (!swaggerUi) {
    swaggerUi = SwaggerUIBundle({
      domNode: el.swagger,
      validatorUrl: null,       // kein Badge von validator.swagger.io nachladen
      deepLinking: false,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
    });
  }
  swaggerUi.specActions.updateSpec(text);
}

/* ---------- State ---------- */
const state = {
  filename: "dokument.md",
  content: "",
  modified: false,
  fileHandle: null,   // File System Access API (Edge/Chrome), sonst null
  embedded: false,
};

const el = {
  editor: document.getElementById("editor"),
  preview: document.getElementById("preview"),
  swagger: document.getElementById("swagger"),
  previewPane: document.getElementById("preview-pane"),
  fileInput: document.getElementById("file-input"),
  fileLabel: document.getElementById("file-label"),
  statusMode: document.getElementById("status-mode"),
  statusCount: document.getElementById("status-count"),
  btnOpen: document.getElementById("btn-open"),
  btnEdit: document.getElementById("btn-edit"),
  btnSave: document.getElementById("btn-save"),
  btnTheme: document.getElementById("btn-theme"),
};

/* ---------- Anzeige ---------- */
function updatePreview() {
  const openapi = hasSwagger && isOpenApi(state.filename, state.content);
  document.body.classList.toggle("view-openapi", openapi);
  if (openapi) { renderSwagger(state.content); return; }
  el.preview.innerHTML = renderMarkdown(SPEC_EXT.test(state.filename)
    ? specAsMarkdown(state.filename, state.content)
    : state.content);
  // Links aus fremden Dokumenten immer in neuem Tab öffnen
  el.preview.querySelectorAll("a[href]").forEach(a => {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });
  renderMermaidIn(el.preview);
}

function updateChrome() {
  const dot = state.modified ? ' <span class="dot" title="ungespeicherte Änderungen">●</span>' : "";
  el.fileLabel.innerHTML = escapeHtml(state.filename) + dot;
  const isEdit = document.body.classList.contains("mode-edit");
  el.btnEdit.textContent = isEdit ? "Lesen" : "Bearbeiten";
  el.statusMode.textContent = isEdit ? "Bearbeiten" : "Lesen";
  const words = (state.content.match(/\S+/g) || []).length;
  el.statusCount.textContent = words + " Wörter · " + state.content.length + " Zeichen";
  document.title = (state.modified ? "● " : "") + state.filename + " – tiny-md";
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function setDocument(filename, content, opts) {
  state.filename = filename || "dokument.md";
  state.content = content;
  state.modified = false;
  state.fileHandle = (opts && opts.fileHandle) || null;
  el.editor.value = content;
  updatePreview();
  updateChrome();
}

/* ---------- Editor ---------- */
let renderTimer = null;
el.editor.addEventListener("input", () => {
  state.content = el.editor.value;
  state.modified = true;
  clearTimeout(renderTimer);
  // SwaggerUI-Neuaufbau ist teurer als Markdown → beim Tippen etwas länger warten
  renderTimer = setTimeout(updatePreview, document.body.classList.contains("view-openapi") ? 400 : 120);
  updateChrome();
});

// Tab fügt zwei Leerzeichen ein statt den Fokus zu wechseln
el.editor.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: eEnd, value } = el.editor;
    el.editor.value = value.slice(0, s) + "  " + value.slice(eEnd);
    el.editor.selectionStart = el.editor.selectionEnd = s + 2;
    el.editor.dispatchEvent(new Event("input"));
  }
});

function setMode(mode) {
  document.body.classList.toggle("mode-edit", mode === "edit");
  document.body.classList.toggle("mode-read", mode !== "edit");
  if (mode === "edit") el.editor.focus();
  updateChrome();
}

el.btnEdit.addEventListener("click", () => {
  setMode(document.body.classList.contains("mode-edit") ? "read" : "edit");
});

/* ---------- Öffnen ---------- */
el.btnOpen.addEventListener("click", () => el.fileInput.click());

el.fileInput.addEventListener("change", async () => {
  const file = el.fileInput.files[0];
  if (file) await loadFile(file);
  el.fileInput.value = "";
});

async function loadFile(file, fileHandle) {
  if (state.modified && !confirm("Ungespeicherte Änderungen verwerfen?")) return;
  const text = await file.text();
  setDocument(file.name, text, { fileHandle: fileHandle || null });
}

/* Drag & Drop */
let dragDepth = 0;
document.addEventListener("dragenter", e => {
  e.preventDefault();
  if (++dragDepth === 1) document.body.classList.add("dragging");
});
document.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); }
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  // Wenn möglich, den FileSystemHandle mitnehmen → direktes Zurückspeichern
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  let handle = null;
  if (item && item.getAsFileSystemHandle) {
    try { handle = await item.getAsFileSystemHandle(); } catch (_) {}
    if (handle && handle.kind !== "file") handle = null;
  }
  const file = e.dataTransfer.files[0];
  if (file) await loadFile(file, handle);
});

/* ---------- Speichern ---------- */
function fileType() {
  if (/\.json$/i.test(state.filename)) return { description: "JSON", mime: "application/json", ext: [".json"] };
  if (/\.ya?ml$/i.test(state.filename)) return { description: "YAML", mime: "application/yaml", ext: [".yaml", ".yml"] };
  return { description: "Markdown", mime: "text/markdown", ext: [".md"] };
}

async function save() {
  const type = fileType();
  // 1. Bereits bekannter Handle (Datei wurde per Picker/Drop mit Handle geöffnet)
  if (state.fileHandle) {
    try {
      const w = await state.fileHandle.createWritable();
      await w.write(state.content);
      await w.close();
      state.modified = false;
      updateChrome();
      return;
    } catch (_) { /* Berechtigung entzogen → weiter zum Picker/Download */ }
  }
  // 2. File System Access API (Edge, Chrome)
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({
        suggestedName: state.filename,
        types: [{ description: type.description, accept: { [type.mime]: type.ext } }],
      });
      const w = await handle.createWritable();
      await w.write(state.content);
      await w.close();
      state.fileHandle = handle;
      state.filename = handle.name;
      state.modified = false;
      updateChrome();
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return; // Nutzer hat abgebrochen
    }
  }
  // 3. Fallback (Firefox): Download
  const blob = new Blob([state.content], { type: type.mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = state.filename;
  a.click();
  URL.revokeObjectURL(url);
  state.modified = false;
  updateChrome();
}
el.btnSave.addEventListener("click", save);

/* ---------- Tastatur ---------- */
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); save(); }
  else if (k === "o") { e.preventDefault(); el.fileInput.click(); }
  else if (k === "e") { e.preventDefault(); el.btnEdit.click(); }
});

window.addEventListener("beforeunload", e => {
  if (state.modified) { e.preventDefault(); e.returnValue = ""; }
});

/* ---------- Theme ---------- */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("tiny-md-theme", theme); } catch (_) {}
  if (hasMermaid) { initMermaid(); updatePreview(); }
}
el.btnTheme.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});
(function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem("tiny-md-theme"); } catch (_) {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
})();

/* ---------- Start ---------- */
(function init() {
  initMermaid();
  const embed = document.getElementById("embedded-md");
  // Beim Einbetten wurde "</script" escaped – hier rückgängig machen
  const embeddedText = embed.textContent.replace(/<\\\/script/gi, "\x3C/script").trim();
  const embeddedName = embed.dataset.filename;

  if (embeddedText && embeddedName !== "__EMBEDDED" + "_FILENAME__") {
    state.embedded = true;
    setDocument(embeddedName || "dokument.md", embeddedText);
    setMode("read");
  } else {
    setDocument("dokument.md", [
      "# tiny-md",
      "",
      "Ein Markdown-Betrachter und -Editor in einer einzigen HTML-Datei – läuft offline, direkt aus dem Dateisystem, auch als E-Mail-Anhang.",
      "",
      "- **Öffnen** (Strg+O): eine `.md`-Datei laden – oder einfach hierher ziehen",
      "- **Bearbeiten** (Strg+E): zwischen Lese- und Bearbeitungsansicht wechseln",
      "- **Speichern** (Strg+S): direkt zurück in die Datei (Edge/Chrome) oder als Download (Firefox)",
      "",
      "Diese Datei kann per Build-Skript auch ein Markdown-Dokument fest eingebettet mitbringen:",
      "",
      "```",
      "node build.js pfad/zur/datei.md",
      "```",
    ].concat(hasMermaid ? [
      "",
      "## Mermaid ist an Bord",
      "",
      "Diese Variante rendert ` ```mermaid `-Codeblöcke als Diagramm:",
      "",
      "```mermaid",
      "flowchart LR",
      "    A[.md öffnen] --> B[marked + DOMPurify]",
      "    B --> C[Mermaid]",
      "    C --> D[SVG-Diagramm]",
      "```",
    ] : []).concat(hasKatex ? [
      "",
      "## KaTeX ist an Bord",
      "",
      "Diese Variante rendert Formeln in `$…$` und `$$…$$`, zum Beispiel $\\Delta\\theta \\approx \\lambda / D$ oder",
      "",
      "$$D \\approx \\frac{\\lambda}{\\Delta\\theta} = \\frac{0{,}343\\,\\mathrm{m}}{0{,}175} \\approx 2{,}0\\,\\mathrm{m}.$$",
    ] : []).concat(hasSwagger ? [
      "",
      "## SwaggerUI ist an Bord",
      "",
      "Diese Variante zeigt OpenAPI-/Swagger-Spezifikationen (`.yaml`, `.yml`, `.json`) direkt an: Datei öffnen oder hierher ziehen. Im Bearbeiten-Modus aktualisiert sich die Ansicht live.",
    ] : []).join("\n"));
    setMode("read");
  }
})();
</script>
