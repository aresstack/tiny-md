name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # Baut alle Varianten und lässt den Smoke-Test laufen
      - name: Build & Test
        run: npm test

      # Lizenztexte für die Swagger-Varianten (SwaggerUI steht unter Apache-2.0)
      - name: Lizenzdateien bereitstellen
        run: |
          cp node_modules/swagger-ui-dist/LICENSE dist/LICENSE-Apache-2.0-SwaggerUI.txt
          cp node_modules/swagger-ui-dist/NOTICE dist/NOTICE-SwaggerUI.txt
          cp LICENSE dist/LICENSE-MIT-tiny-md.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")-${{ github.run_number }}"
          gh release create "$VERSION" \
            dist/tiny-md.html \
            dist/tiny-md-mermaid.html \
            dist/tiny-md-full-mit.html \
            dist/tiny-md-full-apache.html \
            dist/tiny-md-swagger.html \
            dist/beispiel.html \
            dist/diagramme.html \
            dist/api-beispiel.html \
            dist/LICENSE-MIT-tiny-md.txt \
            dist/LICENSE-Apache-2.0-SwaggerUI.txt \
            dist/NOTICE-SwaggerUI.txt \
            --target "$GITHUB_SHA" \
            --title "tiny-md $VERSION" \
            --notes "Offline-fähiger Markdown-Viewer/-Editor als einzelne HTML-Datei.

          - **tiny-md.html** – leere App (~100 kB): öffnet, rendert, bearbeitet und speichert .md-Dateien
          - **tiny-md-mermaid.html** – wie oben, zusätzlich mit Mermaid-Diagramm-Rendering (~3,5 MB)
          - **tiny-md-full-mit.html** – volles MIT-Bundle: alle MIT-lizenzierten Plugins (Mermaid, KaTeX) (~4,3 MB)
          - **tiny-md-full-apache.html** – volles Apache-Bundle: alles aus dem MIT-Bundle plus alle Apache-2.0-Plugins (SwaggerUI) (~6 MB) ¹
          - **tiny-md-swagger.html** – nur SwaggerUI: öffnet OpenAPI-/Swagger-Spezifikationen (.yaml/.yml/.json) direkt (~1,8 MB) ¹
          - **beispiel.html** – App mit eingebettetem Beispieldokument inkl. Mermaid-Diagramm
          - **diagramme.html** – Mermaid-Schaufenster: Mindmap, Flowchart, Sequenz, Pie, Gantt, State, Timeline, Git-Graph
          - **api-beispiel.html** – Swagger-Variante mit eingebetteter Beispiel-OpenAPI-Spezifikation ¹

          **Lizenz:** tiny-md steht unter MIT; die MIT-Lizenz gilt nur für den tiny-md-Code. Eingebettete Bibliotheken behalten ihre eigenen Lizenzen (siehe THIRD-PARTY-NOTICES.md).
          ¹ Enthält [Swagger UI](https://github.com/swagger-api/swagger-ui) (© SmartBear Software Inc.) unter der **Apache License 2.0** – bei Weitergabe Lizenztext und NOTICE beilegen (in den Dateien eingebettet, zusätzlich als LICENSE-Apache-2.0-SwaggerUI.txt / NOTICE-SwaggerUI.txt angehängt).

          Build aus ${{ github.sha }}" \
            --latest
